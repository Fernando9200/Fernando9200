name: Update Activity Graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activity-graph.yml
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Fernando9200
          options: theme=github-compact&hide_border=true&bg_color=0D1117&color=E74C3C&line=E74C3C&point=C9D1D9
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
